# Checks every pull request and push to main: types, both builds, the tests,
# and the npm package as people will install it (scripts/verify-pack.js), on
# the oldest Node that package.json's engines allow and on the current LTS.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The page tests skip without the built page, so build first.
      - run: pnpm build
      - run: pnpm build:demo
      - run: pnpm test
      - run: pnpm verify:pack
